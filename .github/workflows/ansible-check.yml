name: Ansible Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint

      - name: Check playbook syntax
        run: |
          ansible-playbook \
            -i inventory/hosts.ini.example \
            --syntax-check \
            playbooks/cluster-health.yml

      - name: Lint playbook
        run: ansible-lint playbooks/cluster-health.yml
